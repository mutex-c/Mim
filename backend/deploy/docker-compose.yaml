name: mim

services:
  # ----------------------------------------------------------------
  # 单体 / 混合模式运行入口 (支持快速开发与私有化单机部署)
  # ----------------------------------------------------------------
  server:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    container_name: mim-server
    restart: "no"
    ports:
      - "${MIM_PORT:-8088}:8080"
    volumes:
      - ../../mim.db:/app/mim.db
      - ../../uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - MIM_REDIS_ADDR=redis:6379
      - MIM_REDIS_PASSWORD=${REDIS_PASSWORD:-mim_redis_pass_2026}
    profiles:
      - monolith
      - standalone
    networks:
      - mim-net

  # ----------------------------------------------------------------
  # 微服务模式：mim-logic (业务集群，无状态RPC服务)
  # ----------------------------------------------------------------
  logic:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    container_name: mim-logic
    restart: "no"
    command: ["./mim-logic", "-port", "9091", "-redis-addr", "redis:6379", "-redis-pass", "${REDIS_PASSWORD:-mim_redis_pass_2026}", "-etcd-addr", "etcd:2379", "-kafka-brokers", "kafka:29092", "-advertise-addr", "logic:9091"]
    ports:
      - "9091:9091"
    volumes:
      - ../../mim.db:/app/mim.db
    depends_on:
      redis:
        condition: service_healthy
      etcd:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - mim-net

  # ----------------------------------------------------------------
  # 微服务模式：mim-gateway (纯长连接网关集群，零数据库直连)
  # ----------------------------------------------------------------
  gateway:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    container_name: mim-gateway
    restart: "no"
    command: ["./mim-gateway", "-port", "8081", "-grpc-port", "9092", "-logic-addr", "logic:9091", "-redis-addr", "redis:6379", "-redis-pass", "${REDIS_PASSWORD:-mim_redis_pass_2026}", "-etcd-addr", "etcd:2379", "-advertise-addr", "gateway:9092"]
    ports:
      - "8081:8081"
    depends_on:
      - logic
      - redis
      - etcd
    networks:
      - mim-net

  # ----------------------------------------------------------------
  # 微服务模式：mim-transfer (Kafka 消息推流分发集群)
  # ----------------------------------------------------------------
  transfer:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    container_name: mim-transfer
    restart: "no"
    command: ["./mim-transfer", "-kafka-brokers", "kafka:29092", "-redis-addr", "redis:6379", "-redis-pass", "${REDIS_PASSWORD:-mim_redis_pass_2026}", "-etcd-addr", "etcd:2379"]
    depends_on:
      - redis
      - etcd
      - kafka
    networks:
      - mim-net

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: mim-kafka
    restart: "no"
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - mim-net

  mysql:
    image: mysql:8.0
    container_name: mim-mysql
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mim_root_password_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mim_db}
      MYSQL_USER: ${MYSQL_USER:-mim_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mim_password_2026}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max_connections=1000
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-mim_root_password_2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mim-net

  redis:
    image: redis:7-alpine
    container_name: mim-redis
    restart: "no"
    command: redis-server --requirepass ${REDIS_PASSWORD:-mim_redis_pass_2026} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-mim_redis_pass_2026}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - mim-net

  etcd:
    image: quay.io/coreos/etcd:v3.5.11
    container_name: mim-etcd
    restart: "no"
    command:
      - /usr/local/bin/etcd
      - --name=mim-etcd-0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://0.0.0.0:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=mim-etcd-0=http://0.0.0.0:2380
      - --initial-cluster-token=mim-etcd-cluster
      - --initial-cluster-state=new
    volumes:
      - etcd_data:/etcd-data
    networks:
      - mim-net

volumes:
  mysql_data:
  redis_data:
  etcd_data:
  kafka_data:

networks:
  mim-net:
    driver: bridge
